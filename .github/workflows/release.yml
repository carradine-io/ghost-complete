name: Build and release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghost-complete
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

      - name: Validate release tag
        id: version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to release tag '$tag'. Use a semver tag that matches manifest.json, with no leading v."
            exit 1
          fi
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match manifest.json version $version."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.release-tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghost-complete

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release-tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            main.js manifest.json styles.css
