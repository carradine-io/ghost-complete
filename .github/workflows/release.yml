name: Build and release

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload plugin build
        uses: actions/upload-artifact@v4
        with:
          name: ghost-complete
          if-no-files-found: error
          path: |
            main.js
            manifest.json
            styles.css

      - name: Generate artifact attestation
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.]+)?$ ]]; then
            echo "Refusing to release tag '$tag'. Use a semver tag that matches manifest.json, with no leading v."
            exit 1
          fi
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$tag" ]; then
            echo "Tag $tag does not match manifest.json version $version."
            exit 1
          fi
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            main.js manifest.json styles.css
